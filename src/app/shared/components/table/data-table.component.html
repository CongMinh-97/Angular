<div class="data-table-wrapper">
  <div class="table-controls" *ngIf="config?.columns">
    <button nz-button nzType="text" class="column-toggle">
      <span nz-icon nzType="setting" nzTheme="outline"></span>
      Columns
    </button>
  </div>

  <nz-spin [nzSimple]="true" [nzSpinning]="config?.loading || false">
    <nz-table
      #nzTable
      [nzData]="config?.data || []"
      [nzTotal]="config?.total || 0"
      [nzPageSize]="config?.pageSize || 10"
      [nzCurrent]="config?.currentPage || 1"
      [nzShowPagination]="true"
      [nzFrontPagination]="false"
      [nzShowSizeChanger]="true"
      [nzShowQuickJumper]="true"
      [nzBordered]="false"
      [nzSize]="'large'"
      class="modern-table"
      (nzPageChange)="onPageChange($event)"
      (nzPageSizeChange)="onPageSizeChange($event)"
    >
      <!-- Row Number Column -->
      <thead
        *ngIf="config?.showRowNumber"
        nz-thead
      >
        <tr>
          <th nzWidth="50px">No.</th>
          <th
            *ngFor="let col of displayColumns"
            [nzWidth]="col.width"
            [nzSortFn]="col.sortable ? col.key : null"
          >
            {{ col.title }}
          </th>
          <th nzWidth="120px">Actions</th>
        </tr>
      </thead>

      <tbody nz-tbody *ngIf="!config?.showRowNumber">
        <tr *ngFor="let row of nzTable.data; let i = index" (click)="onRowClick(row)">
          <td *ngFor="let col of displayColumns">
            {{ col.render ? col.render(row) : row[col.key] }}
          </td>
          <td>
            <button nz-button nzType="text" nzSize="small">
              <span nz-icon nzType="edit" nzTheme="outline"></span>
            </button>
            <button nz-button nzType="text" nzSize="small" nzDanger>
              <span nz-icon nzType="delete" nzTheme="outline"></span>
            </button>
          </td>
        </tr>
      </tbody>

      <tbody nz-tbody *ngIf="config?.showRowNumber">
        <tr *ngFor="let row of nzTable.data; let i = index" (click)="onRowClick(row)">
          <td class="row-number">{{ (config?.currentPage! - 1) * config?.pageSize! + i + 1 }}</td>
          <td *ngFor="let col of displayColumns">
            {{ col.render ? col.render(row) : row[col.key] }}
          </td>
          <td>
            <button nz-button nzType="text" nzSize="small">
              <span nz-icon nzType="edit" nzTheme="outline"></span>
            </button>
            <button nz-button nzType="text" nzSize="small" nzDanger>
              <span nz-icon nzType="delete" nzTheme="outline"></span>
            </button>
          </td>
        </tr>
      </tbody>
    </nz-table>

    <nz-empty
      *ngIf="!config?.data || config.data.length === 0"
      nzNotFoundContent="No data available"
      class="empty-state"
    ></nz-empty>
  </nz-spin>
</div>
