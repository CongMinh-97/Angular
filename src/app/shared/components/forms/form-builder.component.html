<form [formGroup]="form" class="form-builder">
  <div *ngFor="let field of fields" class="form-field">
    <label nz-label class="field-label">
      {{ field.label }}
      <span *ngIf="field.required" class="required">*</span>
    </label>

    <!-- Text Input -->
    <input
      *ngIf="field.type === 'text' || field.type === 'email' || field.type === 'password' || field.type === 'number'"
      nz-input
      [type]="field.type"
      [formControlName]="field.key"
      [placeholder]="field.placeholder || ''"
      class="form-input"
    />

    <!-- Textarea -->
    <textarea
      *ngIf="field.type === 'textarea'"
      nz-input
      nzAutosize
      [formControlName]="field.key"
      [placeholder]="field.placeholder || ''"
      class="form-input"
    ></textarea>

    <!-- Select -->
    <nz-select
      *ngIf="field.type === 'select'"
      [formControlName]="field.key"
      [nzPlaceHolder]="field.placeholder || 'Select...'"
      class="form-select"
    >
      <nz-option
        *ngFor="let option of field.options"
        [nzValue]="option.value"
        [nzLabel]="option.label"
      ></nz-option>
    </nz-select>

    <!-- Date Picker -->
    <nz-date-picker
      *ngIf="field.type === 'date'"
      [formControlName]="field.key"
      class="form-date"
    ></nz-date-picker>

    <!-- Checkbox -->
    <label
      *ngIf="field.type === 'checkbox'"
      nz-checkbox
      [formControlName]="field.key"
      class="form-checkbox"
    >
      {{ field.label }}
    </label>

    <!-- Radio -->
    <div *ngIf="field.type === 'radio'" class="form-radio">
      <label
        *ngFor="let option of field.options"
        nz-radio
        [nzValue]="option.value"
        [formControlName]="field.key"
      >
        {{ option.label }}
      </label>
    </div>

    <!-- Error Message -->
    <div
      *ngIf="form.get(field.key)?.invalid && form.get(field.key)?.touched"
      class="error-message"
    >
      {{ getFieldError(field.key) }}
    </div>
  </div>

  <div class="form-actions">
    <button
      nz-button
      nzType="primary"
      [disabled]="form.invalid || loading"
      [nzLoading]="loading"
      (click)="onSubmit()"
      class="submit-btn"
    >
      {{ submitButtonText }}
    </button>
    <button
      nz-button
      [disabled]="loading"
      (click)="onCancel()"
      class="cancel-btn"
    >
      {{ cancelButtonText }}
    </button>
  </div>
</form>
