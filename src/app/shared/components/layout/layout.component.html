<nz-layout class="app-layout">
  <!-- Header -->
  <nz-header class="app-header">
    <div class="header-content">
      <div class="header-left">
        <div class="logo-section">
          <span class="logo-text">🚀 Angular Base</span>
        </div>
      </div>

      <div class="header-right">
        <div class="user-section">
          <div class="avatar-circle">👤</div>
          <div class="user-info">
            <span class="user-name">{{ user?.fullName || 'User' }}</span>
          </div>
          <button
            nz-button
            nzType="text"
            (click)="logout()"
            class="logout-link"
            title="Logout"
          >
            <span>↪</span>
          </button>
        </div>
      </div>
    </div>
  </nz-header>

  <nz-layout class="main-container">
    <!-- Sidebar -->
    <nz-sider
      class="app-sidebar"
      [nzCollapsible]="true"
      [nzCollapsed]="isCollapsed"
      [nzWidth]="240"
      [nzCollapsedWidth]="64"
      [nzBreakpoint]="'lg'"
      [nzCollapsedWidth]="0"
    >
      <div class="sidebar-menu">
        <ul nz-menu [nzMode]="'vertical'" [nzTheme]="'light'" [nzInlineIndent]="16">
          <li nz-menu-item nzMatchRouter routerLink="/dashboard" class="menu-item">
            <span nz-icon nzType="dashboard" nzTheme="outline"></span>
            <span>📊 Dashboard</span>
          </li>
          <li nz-submenu class="menu-item">
            <span nz-title>
              <span nz-icon nzType="team" nzTheme="outline"></span>
              <span>👥 Management</span>
            </span>
            <ul>
              <li nz-menu-item nzMatchRouter routerLink="/users">
                <span>Users</span>
              </li>
              <li nz-menu-item nzMatchRouter routerLink="/products">
                <span>Products</span>
              </li>
            </ul>
          </li>
          <li nz-menu-item class="menu-item">
            <span nz-icon nzType="file" nzTheme="outline"></span>
            <span>📋 Reports</span>
          </li>
          <li nz-menu-item class="menu-item">
            <span nz-icon nzType="setting" nzTheme="outline"></span>
            <span>⚙️ Settings</span>
          </li>
        </ul>
      </div>
    </nz-sider>

    <!-- Content Area -->
    <nz-layout class="content-layout">
      <nz-content class="page-content">
        <router-outlet></router-outlet>
      </nz-content>
      <nz-footer class="app-footer">
        <p>&copy; 2024 Angular Base Application. All rights reserved.</p>
      </nz-footer>
    </nz-layout>
  </nz-layout>
</nz-layout>
