<nz-layout class="layout">
  <!-- Header -->
  <nz-header class="header">
    <div class="header-content">
      <div class="header-left">
        <button
          nz-button
          nzType="text"
          class="trigger"
          (click)="toggleMenu()"
        >
          <span
            *ngIf="!isCollapsed"
            nz-icon
            nzType="menu-fold"
            nzTheme="outline"
          ></span>
          <span
            *ngIf="isCollapsed"
            nz-icon
            nzType="menu-unfold"
            nzTheme="outline"
          ></span>
        </button>
        <div class="logo">
          <h2>Dashboard</h2>
        </div>
      </div>

      <div class="header-right">
        <input
          nz-input
          type="text"
          placeholder="Search..."
          class="search-input"
        />
        <button nz-button nzType="text" class="header-btn">
          <span nz-icon nzType="bell" nzTheme="outline"></span>
          <nz-badge [nzCount]="5"></nz-badge>
        </button>
        <button nz-button nzType="text" class="header-btn">
          <span nz-icon nzType="setting" nzTheme="outline"></span>
        </button>

        <div class="user-menu">
          <nz-avatar
            [nzSrc]="user?.avatar || ''"
            [nzSize]="32"
            nzIcon="user"
          ></nz-avatar>
          <span class="user-name">{{ user?.fullName }}</span>
          <button
            nz-button
            nzType="text"
            (click)="logout()"
            class="logout-btn"
          >
            <span nz-icon nzType="logout" nzTheme="outline"></span>
            Logout
          </button>
        </div>
      </div>
    </div>
  </nz-header>

  <nz-layout class="main-layout">
    <!-- Sidebar -->
    <nz-sider
      class="sider"
      [nzCollapsible]="true"
      [nzCollapsed]="isCollapsed"
      [nzWidth]="200"
      [nzCollapsedWidth]="80"
    >
      <ul
        nz-menu
        [nzMode]="'vertical'"
        [nzTheme]="'dark'"
        [nzInlineIndent]="16"
      >
        <li nz-menu-item nzMatchRouter routerLink="/dashboard">
          <span nz-icon nzType="dashboard" nzTheme="outline"></span>
          <span>Dashboard</span>
        </li>
        <li nz-submenu>
          <span nz-title>
            <span nz-icon nzType="team" nzTheme="outline"></span>
            <span>Management</span>
          </span>
          <ul>
            <li nz-menu-item nzMatchRouter routerLink="/users">
              <span>Users</span>
            </li>
            <li nz-menu-item nzMatchRouter routerLink="/products">
              <span>Products</span>
            </li>
          </ul>
        </li>
      </ul>
    </nz-sider>

    <!-- Content -->
    <nz-layout class="inner-layout">
      <nz-content class="content">
        <router-outlet></router-outlet>
      </nz-content>
      <nz-footer class="footer">
        <p>&copy; 2024 Angular Base Application. All rights reserved.</p>
      </nz-footer>
    </nz-layout>
  </nz-layout>
</nz-layout>
