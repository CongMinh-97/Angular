<app-page-header eyebrow="Management" title="Users" subtitle="Invite people, change their role, or remove access. Changes take effect immediately.">
  <a ui-button routerLink="/import" icon="cloud-upload">Import</a>
  <button ui-button icon="download" (click)="exportCsv()">Export CSV</button>
  <button ui-button variant="primary" icon="plus" (click)="openCreate()">Add user</button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [data]="rows()"
  [total]="total()"
  [loading]="loading()"
  [(query)]="query"
  [(selected)]="selected"
  (reload)="load()"
  searchPlaceholder="Search name, email or phone"
  itemLabel="users"
>
  <ui-multi-select
    toolbar
    class="dept-filter"
    placeholder="All departments"
    [options]="departmentOptions"
    [maxTagCount]="1"
    [value]="departmentFilter()"
    (valueChange)="onDepartmentChange($event)"
    inputId="dept-filter"
  />

  <button bulk ui-button variant="danger-soft" size="sm" icon="delete" (click)="removeSelected()">Delete selected</button>

  <ng-template appCell="name" let-u>
    <div class="person">
      <ui-avatar [name]="u.name" />
      <div class="person-text">
        <strong>{{ u.name }}</strong>
        <span>{{ u.email }}</span>
      </div>
    </div>
  </ng-template>

  <ng-template appCell="role" let-u>
    <ui-tag [tone]="roleTone[u.role]" [variant]="u.role === 'Admin' ? 'solid' : 'soft'">{{ u.role }}</ui-tag>
  </ng-template>

  <ng-template appCell="status" let-u>
    <ui-tag [tone]="statusTone[u.status]" dot>{{ statusLabel[u.status] }}</ui-tag>
  </ng-template>

  <ng-template appCell="phone" let-u><span class="mono muted">{{ u.phone }}</span></ng-template>

  <ng-template appCell="spend" let-u>
    <span class="num strong">{{ u.spend * 1000 | currency: 'VND' : 'symbol-narrow' : '1.0-0' }}</span>
  </ng-template>

  <ng-template appCell="createdAt" let-u><span class="muted">{{ u.createdAt | date: 'd MMM y' }}</span></ng-template>
  <ng-template appCell="lastActive" let-u><span class="muted">{{ u.lastActive | date: 'd MMM, HH:mm' }}</span></ng-template>

  <ng-template appCell="actions" let-u>
    <div class="row-actions">
      <button ui-button variant="ghost" size="sm" icon="edit" iconOnly nz-tooltip nzTooltipTitle="Edit" (click)="openEdit(u)" [attr.aria-label]="'Edit ' + u.name"></button>
      <button
        ui-button
        variant="ghost"
        size="sm"
        icon="delete"
        iconOnly
        class="del"
        nz-popconfirm
        [nzPopconfirmTitle]="'Delete ' + u.name + '?'"
        nzOkText="Delete"
        nzOkDanger
        nzCancelText="Cancel"
        nzPopconfirmPlacement="left"
        (nzOnConfirm)="remove(u)"
        [attr.aria-label]="'Delete ' + u.name"
      ></button>
    </div>
  </ng-template>
</app-data-table>

<app-user-form-modal [(open)]="modalOpen" [user]="editing()" (saved)="onSaved()" />
