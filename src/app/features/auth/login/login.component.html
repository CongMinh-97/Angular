<div class="login-container">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-area">
          <h1 class="login-title">Angular Base</h1>
        </div>
        <h2 class="login-subtitle">Welcome Back</h2>
        <p class="login-description">Sign in to your account to continue</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onLogin()" class="login-form">
        <div class="form-group">
          <label>Email Address <span class="required">*</span></label>
          <input
            type="email"
            formControlName="username"
            placeholder="demo@example.com"
            class="form-input"
            [class.error]="form.get('username')?.invalid && form.get('username')?.touched"
          />
          <div *ngIf="form.get('username')?.invalid && form.get('username')?.touched" class="error-text">
            {{ form.get('username')?.hasError('required') ? 'Email is required' : 'Invalid email' }}
          </div>
        </div>

        <div class="form-group">
          <label>Password <span class="required">*</span></label>
          <input
            type="password"
            formControlName="password"
            placeholder="Enter your password"
            class="form-input"
            [class.error]="form.get('password')?.invalid && form.get('password')?.touched"
          />
          <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="error-text">
            Password is required
          </div>
        </div>

        <div class="form-actions">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="rememberMe" class="checkbox-input" />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button
          type="submit"
          [disabled]="form.invalid || loading"
          class="login-button"
          [class.loading]="loading"
        >
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>

        <div class="divider">
          <span>or</span>
        </div>

        <button
          type="button"
          (click)="getDemoCredentials()"
          class="demo-button"
        >
          👤 Use Demo Credentials
        </button>
      </form>

      <div class="login-info">
        <p class="info-title">Demo Access</p>
        <p class="info-text">Email: <strong>admin</strong></p>
        <p class="info-text">Password: <strong>password123</strong></p>
      </div>
    </div>

    <div class="login-decoration">
      <div class="decoration-circle decoration-circle-1"></div>
      <div class="decoration-circle decoration-circle-2"></div>
      <div class="decoration-circle decoration-circle-3"></div>
    </div>
  </div>
</div>
